name: gates
on: [push, pull_request]

# Portable Common Lisp with no FFI: one platform proves it.  The gate is the
# differential oracle against com.inuoe.jzon (JSONTestSuite, random values,
# random doubles), which Quicklisp provides along with jzon's copy of the suite.
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SBCL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sbcl
      - name: Quicklisp dependencies
        run: |
          # Retried: the one step that reaches the network.
          for attempt in 1 2 3; do
            rm -rf ~/quicklisp
            curl -sSLo /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp || { sleep 5; continue; }
            sbcl --non-interactive --load /tmp/quicklisp.lisp \
                 --eval '(quicklisp-quickstart:install :path "~/quicklisp/")' && break
            echo "quicklisp install attempt $attempt failed; retrying"
            sleep 10
          done
          sbcl --non-interactive --load ~/quicklisp/setup.lisp --eval '(ql:quickload "com.inuoe.jzon")'
      - name: Gate
        run: ./run-tests.sh
